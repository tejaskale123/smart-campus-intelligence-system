{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

<div class="form-container">
    <div class="form-card">
        <div class="form-heading">
            <p class="students-kicker">Admin Preferences</p>
            <h1 class="form-title">
                Settings
            </h1>
            <p>Manage campus display details and admin preferences.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Campus Name</label>
                <input
                    type="text"
                    name="campus_name"
                    placeholder="Smart Campus"
                >
            </div>

            <div class="form-group">
                <label>Admin Email</label>
                <input
                    type="email"
                    name="admin_email"
                    placeholder="admin@gmail.com"
                    value="{{ request.user.email }}"
                >
            </div>

            <div class="form-group">
                <label>Theme</label>
                <input
                    type="text"
                    name="theme"
                    placeholder="Dark Neon"
                >
            </div>

            <div class="form-group">
                <label>Change Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="New Password"
                >
            </div>

            <button type="submit" class="submit-btn">
                Save Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
