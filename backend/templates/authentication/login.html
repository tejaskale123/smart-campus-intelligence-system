{% extends 'base/base.html' %}

{% block content %}

<h1>Login</h1>

<div class="card">

    {% if error %}

    <div style="
        background:red;
        padding:10px;
        margin-bottom:20px;
        border-radius:8px;
    ">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>

        <br><br>


        <input type="text" name="username" required>

        <br><br>

        <label>Password</label>

        <br><br>

        <input type="password" name="password" required>

        <br><br>

        <button type="submit">

            Login

        </button>

    </form>

    <br>

    <p>

        Don't have an account?

        <a href="/register/">

            Register

        </a>

    </p>

</div>

{% endblock %}
