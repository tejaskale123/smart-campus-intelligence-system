{% extends 'base/auth_base.html' %}

{% block content %}

<div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 80px);">

    <div class="card" style="width: 100%; max-width: 450px; padding: 40px; border-top: 4px solid var(--neon-blue);">

        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 80px; height: 80px; background: rgba(0, 102, 255, 0.05); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto; border: 1px dashed rgba(255, 255, 255, 0.2);">
                <i class="fas fa-id-card-clip" style="font-size: 35px; color: var(--neon-blue);"></i>
            </div>
            <h2 style="font-size: 24px; margin-bottom: 5px; color: var(--text-primary);">Request Access</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Register for the Smart Campus ERP System</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 20px;">
                <label><i class="fas fa-user" style="color: var(--neon-blue); margin-right: 5px;"></i> Choose Username</label>
                <input type="text" name="username" required placeholder="Enter a unique username" style="padding-left: 20px;">
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label><i class="fas fa-lock" style="color: var(--neon-blue); margin-right: 5px;"></i> Create Password</label>
                <input type="password" name="password" required placeholder="Enter a secure password" style="padding-left: 20px;">
            </div>

            <button type="submit" class="btn" style="width: 100%; font-size: 15px; padding: 15px;">
                <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 14px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
            Already have an account?
            <a href="/login/" style="margin-left: 5px; font-weight: 600; color: var(--neon-blue);">
                <i class="fas fa-sign-in-alt"></i> Login Here
            </a>
        </div>

    </div>

</div>

{% endblock %}
