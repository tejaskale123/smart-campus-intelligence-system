{% extends 'base/base.html' %}

{% block content %}

<h1>Register</h1>

<div class="card">

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>

        <br><br>

        <input type="text" name="username" required>

        <br><br>

        <label>Password</label>

        <br><br>

        <input type="password" name="password" required>

        <br><br>

        <button type="submit">

            Register

        </button>

    </form>

</div>

{% endblock %}
