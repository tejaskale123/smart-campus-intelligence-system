{% extends 'base/base.html' %}

{% block content %}

<section class="form-shell">
    <div class="dashboard-card form-card">
        <div class="section-title">
            <div>
                <h1>Record Attendance</h1>
                <span>Select an existing student from MongoDB before saving.</span>
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label><i class="fas fa-user-graduate"></i> Student</label>
                <select name="student_id" required>
                    <option value="">Select existing student</option>
                    {% for student in students %}
                        <option value="{{ student.id }}">{{ student.name }}{% if student.course %} - {{ student.course }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label><i class="far fa-calendar-alt"></i> Date</label>
                    <input type="date" name="attendance_date" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> Status</label>
                    <select name="status" required>
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn neon-btn">
                <i class="fas fa-save"></i> Save Attendance
            </button>
        </form>
    </div>
</section>

{% endblock %}
