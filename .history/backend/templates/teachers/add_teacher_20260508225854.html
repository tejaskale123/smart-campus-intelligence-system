{% extends 'base/base.html' %}
{% load static %}

{% block content %}

<div class="form-container">

    <div class="form-card">

        <h1 class="form-title">
            Add Teacher
        </h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    name="department"
                    required
                >

            </div>

            <button type="submit" class="submit-btn">
                Create Teacher
            </button>

        </form>

    </div>

</div>

{% endblock %}
