<!DOCTYPE html>
<html>
<head>
    <title>Smart Face Attendance</title>

    <style>

        body{
            margin:0;
            background:#020617;
            font-family:Arial;
            color:white;
        }

        .container{
            width:90%;
            margin:auto;
            padding-top:40px;
        }

        h1{
            font-size:50px;
            color:#22d3ee;
        }

        .camera-box{
            background:#0f172a;
            border-radius:20px;
            padding:30px;
            margin-top:30px;
            box-shadow:0 0 20px rgba(0,255,255,0.1);
        }

        .status{
            margin-top:20px;
            font-size:22px;
            color:#22c55e;
        }

        .btn{
            padding:15px 30px;
            border:none;
            border-radius:10px;
            background:#06b6d4;
            color:white;
            font-size:18px;
            cursor:pointer;
            margin-top:20px;
        }

        .btn:hover{
            background:#0891b2;
        }

        .video-box{
            margin-top:30px;
            border-radius:20px;
            overflow:hidden;
            border:3px solid #22d3ee;
        }

        img{
            width:100%;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Face Attendance</h1>

    <div class="camera-box">

        <h2>Live Face Recognition</h2>

        <p>
            Click start to begin AI attendance system.
        </p>

        <a href="/start-face-attendance/">
            <button class="btn">
                START FACE ATTENDANCE
            </button>
        </a>

        <div class="status">
            AI System Ready ✅
        </div>

        <div class="video-box">

            <img src="https://placehold.co/1200x600/0f172a/22d3ee?text=Camera+Will+Open+In+Desktop+Window">

        </div>

    </div>

</div>

</body>
</html>
