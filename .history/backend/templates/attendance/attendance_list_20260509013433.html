<tbody>

    {% for attendance in attendance_records %}

    <tr>

        <td>

            {{ attendance.student_name }}

        </td>

        <td>

            {{ attendance.attendance_date }}

        </td>

        <td>

            {% if attendance.status == "Present" %}

            <span class="status-present">

                Present

            </span>

            {% else %}

            <span class="status-absent">

                Absent

            </span>

            {% endif %}

        </td>

    </tr>

    {% empty %}

    <tr>

        <td colspan="3">

            No attendance records found.

        </td>

    </tr>

    {% endfor %}

</tbody>
