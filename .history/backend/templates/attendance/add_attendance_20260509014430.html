{% extends 'base/base.html' %}
{% load static %}

{% block content %}

<div class="dashboard-content">

    <div class="page-header">

        <div>

            <p class="page-subtitle">
                ATTENDANCE MANAGEMENT
            </p>

            <h1 class="page-title">
                Add Attendance
            </h1>

            <div class="title-underline"></div>

            <p class="page-description">
                Mark and manage student attendance records.
            </p>

        </div>

    </div>

    <div class="attendance-form-card">

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Select Student
                </label>

                <select
                    name="student_id"
                    required
                    class="form-control"
                >

                    <option value="">
                        Select Student
                    </option>

                    {% for student in students %}

                    <option value="{{ student.id }}">

                        {{ student.name }}
                        -
                        {{ student.email }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>
                    Attendance Date
                </label>

                <input
                    type="date"
                    name="attendance_date"
                    required
                    class="form-control"
                >

            </div>

            <div class="form-group">

                <label>
                    Attendance Status
                </label>

                <select
                    name="status"
                    required
                    class="form-control"
                >

                    <option value="Present">

                        Present

                    </option>

                    <option value="Absent">

                        Absent

                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="save-btn"
            >

                SAVE ATTENDANCE

            </button>

        </form>

    </div>

</div>

{% endblock %}
